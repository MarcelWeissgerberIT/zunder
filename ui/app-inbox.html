<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title></title>
<link rel="stylesheet" href="apps.css">
<link rel="stylesheet" href="app-inbox.css">
</head>
<body>
<!--ICONS-->
<header id="bar">
  <div id="bar-left">
    <h1 id="title"></h1>
    <span id="count" class="count"></span>
  </div>
  <div id="bar-right">
    <div id="view" class="segmented"></div>
    <button id="refresh" type="button" class="ghost"></button>
    <button id="settings-btn" type="button" class="ghost"></button>
  </div>
</header>

<p id="banner" class="banner" hidden>
  <span id="banner-text"></span>
  <button id="banner-action" type="button" class="link" hidden></button>
</p>

<main>
  <div id="list" class="list"></div>
  <div id="view-board" class="board" hidden></div>
  <p id="empty" class="empty" hidden></p>
</main>

<!-- Einrichtung: Adresse + Token -->
<section id="setup" class="sheet" hidden>
  <form id="setup-form" class="sheet-box">
    <header>
      <h2 id="setup-title"></h2>
      <button id="setup-close" type="button" class="round" aria-label="x"><svg><use href="#i-close"/></svg></button>
    </header>
    <p id="setup-hint" class="hint"></p>
    <label id="server-label" for="server"></label>
    <input id="server" type="url" autocomplete="off" spellcheck="false" placeholder="https://">
    <p id="server-hint" class="hint"></p>
    <label id="token-label" for="token"></label>
    <input id="token" type="password" autocomplete="off" spellcheck="false">
    <p id="token-hint" class="hint"></p>
    <p id="status-line" class="hint"></p>
    <div class="actions">
      <button id="signout" type="button" class="ghost danger" hidden></button>
      <span class="spacer"></span>
      <button id="cancel" type="button" class="ghost"></button>
      <button id="save" type="submit" class="primary"></button>
    </div>
  </form>
</section>

<!-- Schnellvorschau eines Vorgangs (read-only) -->
<section id="preview" class="sheet" hidden>
  <div class="sheet-box preview-box">
    <header>
      <h2 id="pv-title"></h2>
      <button id="pv-close" type="button" class="round" aria-label="x"><svg><use href="#i-close"/></svg></button>
    </header>
    <div id="pv-meta" class="meta"></div>
    <div id="pv-tags" class="meta"></div>
    <div id="pv-body" class="pv-body"></div>
    <div class="actions">
      <span class="spacer"></span>
      <a id="pv-open" class="primary" target="_blank" rel="noopener" hidden></a>
    </div>
  </div>
</section>

<div id="toast" hidden><span id="toast-text"></span></div>

<!--DATA-->
<script src="apps.js"></script>
<script src="app-inbox.js"></script>
</body>
</html>
