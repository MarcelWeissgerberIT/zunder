<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title></title>
<link rel="stylesheet" href="apps.css">
<link rel="stylesheet" href="app-security.css">
</head>
<body>
<!--ICONS-->
<main>
  <h1 id="title"></h1>

  <section id="panel" class="card">
    <form id="search-form">
      <div id="search-row">
        <svg><use href="#i-shield"/></svg>
        <input id="url-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url">
        <button id="check" type="submit" class="primary"></button>
      </div>
    </form>
    <p id="own" class="hint"></p>
    <div id="recent"></div>
  </section>

  <p id="private-note" class="banner" hidden></p>

  <section id="intro" class="card">
    <svg class="big"><use href="#i-shield"/></svg>
    <h2 id="intro-title"></h2>
    <p id="intro-text"></p>
  </section>

  <section id="busy" class="card" hidden>
    <span class="spin"></span>
    <span id="busy-text"></span>
  </section>

  <section id="trouble" class="card" hidden>
    <svg><use href="#i-warning"/></svg>
    <p id="trouble-text"></p>
  </section>

  <section id="result" class="card" hidden>
    <div id="verdict">
      <span id="verdict-dot"></span>
      <div>
        <strong id="verdict-word"></strong>
        <span id="verdict-count"></span>
      </div>
      <button id="export" type="button" class="ghost"></button>
      <button id="rescan" type="button" class="ghost"></button>
    </div>
    <p id="checked" class="sub"></p>
    <div id="groups"></div>
  </section>

  <p id="note" class="note"></p>
</main>

<!--DATA-->
<script src="apps.js"></script>
<script src="app-security.js"></script>
</body>
</html>
